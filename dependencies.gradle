dependencies {
    api('com.github.GTNewHorizons:NotEnoughEnergistics:1.7.38:dev')
    api('com.github.GTNewHorizons:NotEnoughItems:2.8.114-GTNH:dev')
    api('com.github.GTNewHorizons:Applied-Energistics-2-Unofficial:rv3-beta-1024-GTNH:dev')
    devOnlyNonPublishable('com.github.GTNewHorizons:AE2FluidCraft-Rework:1.5.99-gtnh:dev') {
        transitive = false
    }

    // HBM Nuclear Tech Mod is required at both compile and runtime: the recipe
    // drivers and fluid registry reference HBM types directly (setRecipe,
    // ModuleMachineBase, ArcWelderRecipes, SolderingRecipes, api.hbm.fluidmk2).
    // Pulled as a deobfuscated dev-only jar from libs/, exactly like ntm-fc did,
    // so it is present in dev/runClient but never published as a Maven dependency.
    def hbmJars = fileTree(dir: 'libs', include: 'HBM-NTM-*.jar').files.toList()
    if (hbmJars.isEmpty()) {
        throw new GradleException(
            "\n\nNo HBM jar found in libs/.\n" +
            "Place the HBM Nuclear Tech Mod release JAR in the libs/ directory before building.\n")
    }
    if (hbmJars.size() > 1) {
        throw new GradleException(
            "\n\nMultiple JARs found in libs/: ${hbmJars.collect { it.name }.join(', ')}.\n" +
            "Keep only one HBM jar in libs/ at a time.\n")
    }
    devOnlyNonPublishable(rfg.deobf(project.files(hbmJars[0])))
    // Exercise the real HBM recipe matcher in tests, not a duplicate test implementation.
    testImplementation(rfg.deobf(project.files(hbmJars[0])))

    // Not Enough Characters (pinyin search) is optional and client-only, so a missing jar is
    // not an error. PinyinBridge resolves it reflectively, so nothing hard-links to its API.
    // devOnlyNonPublishable goes to compileOnly plus the dev/test runtime, never published.
    // The released jar is SRG-named, hence rfg.deobf().
    def necharJars = fileTree(dir: 'libs', include: 'nechar-*.jar').files.toList()
    if (necharJars.size() > 1) {
        throw new GradleException(
            "\n\nMultiple nechar JARs found in libs/: ${necharJars.collect { it.name }.join(', ')}.\n" +
            "Keep only one nechar jar in libs/ at a time.\n")
    }
    if (necharJars.isEmpty()) {
        // Otherwise the only symptom is pinyin silently not working at runtime.
        logger.lifecycle(
            "[nechar] libs/nechar-*.jar not found; pinyin search falls back to plain text matching.")
    } else {
        devOnlyNonPublishable(rfg.deobf(project.files(necharJars[0])))
    }

    testImplementation('junit:junit:4.12')

}
